<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Damophus</title>
  <desc id="desc">A suspended sword hangs above Sisyphus pushing a boulder uphill.</desc>

  <rect x="20" y="20" width="472" height="472" rx="108" fill="#17181b"/>
  <path d="M86 421 377 307 438 421Z" fill="#2b2c31"/>
  <path d="M86 421 377 307" fill="none" stroke="#f2eee5" stroke-width="18" stroke-linecap="round"/>

  <!-- The hanging sword forms the vertical counterweight to the rising stone. -->
  <path d="M190 45v29" fill="none" stroke="#d84a3d" stroke-width="8" stroke-linecap="round"/>
  <circle cx="190" cy="87" r="13" fill="none" stroke="#f2eee5" stroke-width="9"/>
  <path d="M181 103h18l4 50h-26Z" fill="#f2eee5"/>
  <path d="M128 154h124l-13 21h-98Z" fill="#f2eee5"/>
  <path d="m158 171 64 1-13 105-19 52-19-52Z" fill="#f2eee5"/>
  <path d="m190 191 1 94" fill="none" stroke="#d8d3c9" stroke-width="7" stroke-linecap="round"/>

  <!-- Sisyphus and the boulder share the same rising diagonal. -->
  <circle cx="346" cy="259" r="57" fill="#d84a3d"/>
  <path d="M319 229a57 57 0 0 1 55-20" fill="none" stroke="#f07868" stroke-width="10" stroke-linecap="round" opacity=".8"/>

  <circle cx="258" cy="315" r="17" fill="#f2eee5"/>
  <path d="m250 339-20 50m20-50 34 31m-52 16-40 34m38-31 19 32"
        fill="none" stroke="#f2eee5" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m254 346 31-44 34-17m-52 52 23-26 34-10"
        fill="none" stroke="#f2eee5" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M86 421h352" fill="none" stroke="#f2eee5" stroke-width="18" stroke-linecap="round"/>
</svg>
