<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Damophus</title>
  <desc id="desc">A suspended sword hangs above Sisyphus pushing a boulder uphill.</desc>
  <defs>
    <clipPath id="boulder-clip">
      <circle cx="367" cy="264" r="57"/>
    </clipPath>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="108" fill="#14211f"/>
  <rect x="30" y="30" width="452" height="452" rx="99" fill="none" stroke="#2b3b37" stroke-width="4"/>

  <!-- A taut red thread suspends a classical double-edged sword. -->
  <path d="M165 43v27" fill="none" stroke="#e0644d" stroke-width="7" stroke-linecap="round"/>
  <circle cx="165" cy="84" r="12" fill="none" stroke="#dbe5e5" stroke-width="8"/>
  <path d="m165 94 10 10-10 10-10-10Z" fill="#d7ad5c"/>
  <rect x="154" y="111" width="22" height="43" rx="8" fill="#76552f"/>
  <path d="m156 119 18 8m-19 4 19 8m-19 4 18 8" fill="none" stroke="#d7ad5c" stroke-width="5"/>
  <path d="M105 151q22 13 46 2l14-8 14 8q24 11 46-2l-8 19q-21 9-42-2l-10 9-10-9q-21 11-42 2Z"
        fill="#d7ad5c"/>
  <path d="M143 171h44l-6 107-16 52-16-52Z" fill="#b9c9ca" stroke="#e9f0ef" stroke-width="3" stroke-linejoin="round"/>
  <path d="m165 182 8 94-8 31-8-31Z" fill="#eef4f2"/>

  <!-- The figure stands on level ground; only the boulder rests on the incline. -->
  <path d="m287 370 127-65 27 116H287Z" fill="#273633"/>
  <path d="m287 370 127-65" fill="none" stroke="#c6ad76" stroke-width="14" stroke-linecap="round"/>

  <circle cx="367" cy="264" r="57" fill="#d95b47"/>
  <path d="M333.3 235.7A44 44 0 0 1 373.1 220.4" fill="none" stroke="#f08a6d" stroke-width="10"
        stroke-linecap="round" clip-path="url(#boulder-clip)"/>

  <circle cx="255" cy="311" r="15" fill="#f3ede2"/>
  <path d="m255 334-17 43" fill="none" stroke="#f3ede2" stroke-width="23" stroke-linecap="round"/>
  <path d="m252 340 31-31 38-23m-72 62 32-22 43-21"
        fill="none" stroke="#f3ede2" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m237 376-29 19-26 21h23" fill="none" stroke="#f3ede2" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m240 377 29 6-2 34h25" fill="none" stroke="#f3ede2" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M75 421h366" fill="none" stroke="#f3ede2" stroke-width="15" stroke-linecap="round"/>
</svg>
