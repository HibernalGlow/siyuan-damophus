<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Damophus mobile breadcrumb and liquid-glass enhancements</title>
  <desc id="desc">The mobile title bar keeps native actions, the original breadcrumb menu becomes a complete clickable path with expandable arrows and horizontal scrolling, and both rows share one selectable glass surface.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#30433e" stroke-width="1" opacity="0.25"/>
    </pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe8e4" stop-opacity="0.28"/>
      <stop offset="0.72" stop-color="#7aa69a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#111a18" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="460" rx="14" fill="#111a18"/>
  <rect x="1" y="1" width="1198" height="458" rx="13" fill="none" stroke="#344944" stroke-width="2"/>
  <rect width="1200" height="460" rx="14" fill="url(#grid)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="54" y="62" fill="#f3ede2" font-size="40" font-weight="800">移动端标题栏与完整面包屑</text>
    <text x="1146" y="58" fill="#9fb2ad" font-size="18" font-weight="700" text-anchor="end">MOBILE READING SURFACE</text>
    <path d="M54 82H1146" stroke="#344944" stroke-width="2"/>

    <g id="mobile-surface" transform="translate(54 112)">
      <rect width="720" height="260" rx="18" fill="#182420" stroke="#4a625c" stroke-width="2"/>
      <rect width="720" height="132" rx="18" fill="url(#glass)"/>
      <path d="M0 82H720" stroke="#d5dfdc" stroke-opacity="0.16"/>

      <g id="titlebar">
        <text x="24" y="43" fill="#9fb2ad" font-size="16" font-weight="700">TITLE BAR</text>
        <text x="24" y="69" fill="#f3ede2" font-size="22" font-weight="800">当前文档标题</text>

        <g transform="translate(524 18)" fill="none" stroke="#d5dfdc" stroke-width="2">
          <rect width="38" height="38" rx="7" fill="#23332f"/><path d="M13 20h12M16 16v-3a3 3 0 0 1 6 0v3"/>
          <rect x="48" width="38" height="38" rx="7" fill="#23332f"/><path d="M59 12h16v14H59zM63 9h8"/>
          <rect x="96" width="38" height="38" rx="7" fill="#23332f"/><circle cx="108" cy="19" r="1" fill="#d5dfdc"/><circle cx="115" cy="19" r="1" fill="#d5dfdc"/><circle cx="122" cy="19" r="1" fill="#d5dfdc"/>
          <rect x="144" width="38" height="38" rx="7" fill="#23332f"/><path d="M155 13h16M155 19h16M155 25h16"/>
        </g>
      </g>

      <g id="breadcrumb" transform="translate(18 89)">
        <rect width="684" height="54" rx="8" fill="#1a2824" stroke="#7aa69a" stroke-width="2"/>
        <g transform="translate(15 10)" font-size="17" font-weight="700">
          <rect width="120" height="34" rx="5" fill="#253832"/>
          <text x="14" y="23" fill="#f3ede2">知识库</text>
          <text x="126" y="23" fill="#d7ad5c">›</text>
          <rect x="148" width="150" height="34" rx="5" fill="#253832"/>
          <text x="162" y="23" fill="#f3ede2">章节标题</text>
          <text x="308" y="23" fill="#d7ad5c">›</text>
          <rect x="330" width="194" height="34" rx="5" fill="#2b4039" stroke="#e0644d"/>
          <text x="344" y="23" fill="#f3ede2">当前内容块</text>
          <path d="M552 17H626" stroke="#7aa69a" stroke-width="3" stroke-linecap="round"/>
          <path d="m618 10 10 7-10 7" fill="none" stroke="#7aa69a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <g transform="translate(24 170)" font-size="18">
        <circle cx="8" cy="4" r="5" fill="#e0644d"/><text x="24" y="11" fill="#d5dfdc">路径项目可点击跳转</text>
        <circle cx="250" cy="4" r="5" fill="#d7ad5c"/><text x="266" y="11" fill="#d5dfdc">分隔箭头保留原生展开</text>
        <circle cx="8" cy="46" r="5" fill="#7aa69a"/><text x="24" y="53" fill="#d5dfdc">横向滑动查看完整路径</text>
        <circle cx="250" cy="46" r="5" fill="#9fb2ad"/><text x="266" y="53" fill="#d5dfdc">支持编辑器与闪卡界面</text>
      </g>
    </g>

    <g id="settings" transform="translate(816 112)">
      <rect width="330" height="260" rx="10" fill="#192724" stroke="#344944" stroke-width="2"/>
      <text x="22" y="36" fill="#9fb2ad" font-size="17" font-weight="700">DISPLAY OPTIONS</text>

      <text x="22" y="76" fill="#f3ede2" font-size="22" font-weight="800">路径显示</text>
      <rect x="22" y="92" width="286" height="42" rx="6" fill="#23332f"/>
      <text x="38" y="119" fill="#d5dfdc" font-size="18">完整 / 字符裁剪 / 宽度裁剪</text>

      <text x="22" y="173" fill="#f3ede2" font-size="22" font-weight="800">玻璃预设</text>
      <g transform="translate(22 190)" font-size="17" font-weight="700">
        <rect width="82" height="38" rx="5" fill="#23332f" stroke="#7aa69a"/><text x="18" y="25" fill="#d5dfdc">渐进模糊</text>
        <rect x="94" width="82" height="38" rx="5" fill="#23332f" stroke="#d7ad5c"/><text x="112" y="25" fill="#d5dfdc">毛玻璃</text>
        <rect x="188" width="98" height="38" rx="5" fill="#2b4039" stroke="#e0644d"/><text x="204" y="25" fill="#f3ede2">液态玻璃</text>
      </g>
    </g>

    <text x="54" y="418" fill="#d5dfdc" font-size="20">原生按钮不复制：Damophus 只重排移动布局，并统一顶部玻璃表面。</text>
    <text x="1146" y="418" fill="#9fb2ad" font-size="17" font-weight="700" text-anchor="end">NO CLONED ACTIONS · NATIVE EXPAND HANDLER</text>
  </g>
</svg>
