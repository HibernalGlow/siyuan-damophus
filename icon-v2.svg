<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Damophus">
  <title>Damophus</title>
  <desc>Suspended sword and rolling stone — the duality of pressure and persistence</desc>

  <!-- Rounded square app container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="currentColor" opacity=".06"/>

  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== Upper: Suspended Sword (Damocles) ===== -->
    <!-- Anchor point -->
    <circle cx="64" cy="22" r="2.4" fill="currentColor" opacity=".5"/>

    <!-- Thread (delicate, single hair) -->
    <line x1="64" y1="24" x2="64" y2="36" stroke-width="1.2" opacity=".6"/>

    <!-- Sword hilt -->
    <rect x="60" y="36" width="8" height="6" rx="1.5" fill="currentColor" opacity=".85"/>

    <!-- Crossguard (minimal) -->
    <line x1="54" y1="42" x2="74" y2="42" stroke-width="2.5"/>

    <!-- Blade (tapered, elegant) -->
    <path d="M64 44.5 L61 68 L64 72 L67 68 Z" fill="currentColor" opacity=".9"/>
    <line x1="64" y1="44.5" x2="64" y2="70" stroke-width="1" opacity=".3"/>

    <!-- ===== Lower: Ascending Path & Stone (Sisyphus) ===== -->
    <!-- Mountain path (elegant curve) -->
    <path d="M20 102 Q44 88, 64 76 Q84 88, 108 102"
          stroke-width="3.5" opacity=".25"/>

    <!-- Steeper active section -->
    <path d="M52 86 Q64 76, 78 72"
          stroke-width="4" opacity=".7" stroke-dasharray="0 6"/>

    <!-- The Boulder (main symbol of eternal effort) -->
    <circle cx="78" cy="72" r="13" fill="currentColor" opacity=".85"/>

    <!-- Boulder texture (subtle carved lines) -->
    <path d="M68 68 Q73 71, 75 76" stroke-width="1.8" opacity=".25"/>
    <path d="M82 64 Q85 68, 86 74" stroke-width="1.8" opacity=".25"/>

    <!-- Previous position ghost (showing repetition) -->
    <circle cx="58" cy="84" r="8" stroke-width="2" opacity=".15" stroke-dasharray="2 3"/>

    <!-- ===== The Figure (abstract, pushing force) ===== -->
    <!-- Head -->
    <circle cx="64" cy="80" r="3.5" fill="currentColor" opacity=".75"/>

    <!-- Body angle (leaning into effort) -->
    <line x1="64" y1="83" x2="68" y2="94" stroke-width="3.2" opacity=".75"/>

    <!-- Pushing arm -->
    <path d="M66 87 L74 76" stroke-width="2.8" opacity=".75"/>

    <!-- Bracing leg -->
    <path d="M68 94 L64 102" stroke-width="2.8" opacity=".75"/>
    <path d="M68 94 L74 100" stroke-width="2.8" opacity=".75"/>

    <!-- ===== Conceptual: Cycle indicator ===== -->
    <!-- Circular arrow hint (eternal return) -->
    <path d="M88 66 A20 20 0 0 1 94 82"
          stroke-width="1.8" opacity=".2" stroke-dasharray="3 4"/>
    <path d="M94 82 L91 78 L90 84" fill="currentColor" opacity=".2"/>

  </g>

  <style>
    svg {
      color: #1a2332;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        color: #e4e9f0;
      }
    }
  </style>
</svg>