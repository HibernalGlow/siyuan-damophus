<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #1b1f2e; display: flex; gap: 48px; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .cap { color: #9aa3b5; font-size: 18px; }
  .dark { background: #171c2c; border-radius: 28px; padding: 32px; }
  .light { background: #f4f4f2; border-radius: 28px; padding: 32px; }
</style>
</head>
<body>
  <div class="cell">
    <div class="dark"><img src="icon.svg" width="320" height="320"></div>
    <div class="cap">dark</div>
  </div>
  <div class="cell">
    <div class="light"><img src="icon.svg" width="320" height="320"></div>
    <div class="cap">light</div>
  </div>
</body>
</html>
