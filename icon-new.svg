<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Damophus">
  <title>Damophus</title>
  <desc>Tension and persistence — abstract geometric interpretation</desc>

  <defs>
    <linearGradient id="tension" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="ascent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="currentColor" opacity=".04"/>

  <!-- Upper: Descending pressure (inverted triangle - sword abstraction) -->
  <path d="M64 24 L44 54 L84 54 Z" fill="url(#tension)" opacity=".85"/>

  <!-- Suspended thread indication (minimal line) -->
  <line x1="64" y1="18" x2="64" y2="24" stroke="currentColor" stroke-width="1.5" opacity=".4" stroke-linecap="round"/>

  <!-- Tension point marker -->
  <circle cx="64" cy="54" r="2.5" fill="currentColor" opacity=".6"/>

  <!-- Central axis - the balance line -->
  <line x1="64" y1="54" x2="64" y2="74" stroke="currentColor" stroke-width="1" opacity=".2" stroke-dasharray="2 3"/>

  <!-- Lower: Ascending effort (spiral/circular path) -->
  <g opacity=".8">
    <!-- The eternal circle/boulder (filled) -->
    <circle cx="64" cy="90" r="16" fill="currentColor" opacity=".75"/>

    <!-- Ascending spiral path (showing perpetual motion) -->
    <path d="M64 106 A16 16 0 0 1 48 90 A24 24 0 0 1 64 66 A32 32 0 0 1 96 90"
          fill="none" stroke="url(#ascent)" stroke-width="3" stroke-linecap="round"/>

    <!-- Direction indicator (upward arrow) -->
    <path d="M96 90 L92 86 L100 86 Z" fill="currentColor" opacity=".5"/>
  </g>

  <!-- Conceptual connecting element: the point where pressure meets persistence -->
  <circle cx="64" cy="64" r="4" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".25"/>
  <circle cx="64" cy="64" r="8" fill="none" stroke="currentColor" stroke-width="1" opacity=".15"/>

  <style>
    svg {
      color: #16213d;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        color: #e6ebf3;
      }
    }
  </style>
</svg>